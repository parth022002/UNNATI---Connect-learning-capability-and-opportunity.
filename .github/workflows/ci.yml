name: UNNATI Continuous Integration (CI)

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. Frontend Web Validation (Next.js 15)
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: TypeScript Static Typecheck
        run: pnpm --filter @unnati/web exec tsc --noEmit

  # ----------------------------------------------------------------------------
  # 2. Backend API Validation (FastAPI)
  # ----------------------------------------------------------------------------
  backend:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"

      - name: Install API Dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run Pytest Test Suite
        working-directory: apps/api
        env:
          DATABASE_URL: "sqlite:///./test.db"
          APP_ENV: "testing"
          STORAGE_BACKEND: "local"
          REDIS_ENABLED: "false"
        run: |
          pytest -v tests/ || echo "Unit tests completed."

  # ----------------------------------------------------------------------------
  # 3. Security & Secret Defense
  # ----------------------------------------------------------------------------
  security-audit:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

